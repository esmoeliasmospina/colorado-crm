/* Layout: top bar (brand · tabs · viewer · +deal) over a switching main (dashboard / kanban / table); right slide-over for a deal. */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface2:#FAF8F2; --ink:#1B2123; --muted:#6C7168;
  --line:#E4E0D5; --line2:#EEEBE2;
  --brand:#0A3B2A; --brand2:#12543B; --gold:#AF7A1C; --gold-soft:#EBD9B4;
  --good:#2E7D55; --good-bg:#E6F0EA; --warn:#9C7016; --warn-bg:#F6ECD6; --crit:#A8463C; --crit-bg:#F3E3E0;
  --t-cvc:#B2822F; --t-cvc-bg:#F4E9D2; --t-fo:#0A3B2A; --t-fo-bg:#E2EBE5; --t-fundo:#2B6E79; --t-fundo-bg:#DCECEE; --t-poc:#6D4C9F; --t-poc-bg:#ECE4F4;
  --shadow:0 1px 2px rgba(26,36,32,.05),0 6px 20px rgba(26,36,32,.06);
  --radius:12px;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D120F; --surface:#151D18; --surface2:#1A241D; --ink:#E9E6DC; --muted:#99A094;
  --line:#28322B; --line2:#222B25;
  --brand:#49A078; --brand2:#5BB389; --gold:#D3A862; --gold-soft:#4A3C22;
  --good:#5FB487; --good-bg:#17291F; --warn:#D3A862; --warn-bg:#2B2416; --crit:#D98A80; --crit-bg:#2E1C19;
  --t-cvc:#D3A862; --t-cvc-bg:#2B2416; --t-fo:#49A078; --t-fo-bg:#152A20; --t-fundo:#5FB0BC; --t-fundo-bg:#15282B; --t-poc:#B79BDE; --t-poc-bg:#241A33;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D120F; --surface:#151D18; --surface2:#1A241D; --ink:#E9E6DC; --muted:#99A094;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.cvname{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.1px;white-space:nowrap}
.bdiv{width:1px;height:22px;background:var(--line);flex:0 0 auto}
.pwby{font-size:9px;line-height:1.16;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;flex:0 0 auto;white-space:nowrap}
.gclogo{height:26px;width:auto;display:block;flex:0 0 auto}
.cvsym{height:25px;width:auto;display:block;flex:0 0 auto;margin:0 2px 0 4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gclogo{filter:brightness(0) invert(1) brightness(.92)}}
:root[data-theme="dark"] .gclogo{filter:brightness(0) invert(1) brightness(.92)}
@media (max-width:640px){.pwby,.gclogo,.bdiv{display:none}}

.brand b{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.1px;white-space:nowrap}
.brand small{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:-1px}
.tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:7px;font-weight:600;font-size:13px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.viewer{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.ava{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--surface2);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--brand);color:#F4EFE3;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand2)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}

main{max-width:1280px;margin:0 auto;padding:18px 16px 60px;padding-block:18px 60px}

.hero .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#D9C9A6;font-weight:700}
.hero .wm{height:30px;width:auto;display:block;margin:7px 0 7px;filter:brightness(0) invert(1);opacity:.96}
.hero p{margin:0;font-size:13.5px;color:#D8E2DA;max-width:46ch}

/* banners */
.note{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:14px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{font-family:var(--serif);color:var(--ink);font-size:20px;margin:0 0 6px}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--serif);font-size:30px;font-weight:600;margin-top:3px;line-height:1}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.stat .v .u{font-size:14px;color:var(--muted);font-family:var(--sans)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.panel h2{font-family:var(--serif);font-weight:600;font-size:16px;margin:0;padding:14px 16px 0}
.panel .sub{padding:1px 16px 0;color:var(--muted);font-size:12px}
.funnelgrid{padding:12px 16px 16px;display:grid;gap:14px}
.fnl{display:grid;gap:7px}
.fnl .hd{display:flex;align-items:center;gap:8px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.chip.cvc{background:var(--t-cvc-bg);color:var(--t-cvc)} .chip.fo{background:var(--t-fo-bg);color:var(--t-fo)} .chip.fundo{background:var(--t-fundo-bg);color:var(--t-fundo)} .chip.poc{background:var(--t-poc-bg);color:var(--t-poc)}
.bars{display:flex;gap:6px;flex-wrap:wrap}
.barcell{flex:1;min-width:84px;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.barcell .bn{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barcell .bc{font-family:var(--serif);font-size:20px;font-weight:600}
.barcell .bar{height:4px;border-radius:3px;background:var(--brand);margin-top:5px;opacity:.85}

/* kanban */
.kbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 240px;scroll-snap-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:120px}
.col.drop{outline:2px dashed var(--gold);outline-offset:-3px}
.col .ch{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;position:sticky;top:0}
.col .ch .nm{font-weight:700;font-size:12.5px}
.col .ch .ct{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.col .body{padding:0 9px 10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--acc,var(--brand));border-radius:10px;padding:10px 11px;box-shadow:var(--shadow);cursor:pointer}
.card:hover{border-color:var(--gold)}
.card .cn{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
.logoWrap{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--line);font-size:9.5px;font-weight:700;color:var(--muted);overflow:hidden;position:relative;line-height:1}
.logoWrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.logoLg{width:42px;height:42px;border-radius:10px;font-size:15px}
.card .cs{font-size:11.5px;color:var(--muted);margin-top:2px}
.card .cz{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cf{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
.card .val{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:10px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.neu{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.drv{color:var(--muted);text-decoration:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
.drv:hover{color:var(--gold);border-color:var(--gold)}

/* table */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;width:100%;outline:none}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface2)}
.tname{font-weight:600}
.muted{color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dhead .ti{flex:1;min-width:0}
.dhead h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;word-break:break-word}
.dhead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.dbody{padding:16px 18px;overflow-y:auto;flex:1}
.resumo{font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;padding:12px 14px;margin-bottom:15px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.field .ro{font-size:14px;word-break:break-word;white-space:pre-wrap}
.field.hl .ro{font-weight:600;color:var(--ink)}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);font:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sectlabel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:16px 0 9px;padding-top:12px;border-top:1px solid var(--line2)}
.linkbtn{background:transparent;border:0;color:var(--crit);font-weight:600;font-size:13px;padding:6px}
.drvbig{display:inline-flex;align-items:center;gap:8px;background:var(--t-fundo-bg);color:var(--t-fundo);border:1px solid color-mix(in srgb,var(--t-fundo) 30%,transparent);border-radius:9px;padding:9px 12px;font-weight:600;text-decoration:none;font-size:13px}
.acts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.act{display:flex;gap:9px;align-items:flex-start}
.act .ai{width:22px;flex:0 0 22px;text-align:center;font-size:14px;line-height:1.35}
.act .ac{flex:1;min-width:0;border-left:2px solid var(--line);padding:0 0 2px 10px}
.act .at{font-size:13.5px;font-weight:600;word-break:break-word}
.act .at a{color:var(--t-fundo);text-decoration:none}
.act .asn{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap;word-break:break-word}
.act .ad{font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand);color:#F3EFE4;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .2s;z-index:60;font-size:13px;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
svg.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){
  .brand small{display:none}
  .tabs{order:3;width:100%;justify-content:space-between}
  .tab{flex:1}
  .hero h1{font-size:22px}
}
</style>

<style id="auth-style">
.authgate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb,var(--gold) 10%, var(--bg)), var(--bg));padding:20px}
.authgate[hidden]{display:none}
.authcard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,.14);padding:34px 30px 28px;text-align:center}
.authglyph{height:46px;width:auto;margin:0 auto 14px;display:block}
.authcard h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;color:var(--ink);letter-spacing:.2px}
.authsub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:3px 0 22px}
.authtabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.authtabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer}
.authtabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.authrow{margin-bottom:11px}
.authrow[hidden]{display:none}
.authrow input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;padding:12px 13px;font-size:14px;outline:none}
.authrow input:focus{border-color:var(--gold)}
.authbtn{width:100%;margin-top:6px;border:0;background:var(--gold);color:#fff;font-weight:700;font-size:14px;
  padding:13px;border-radius:10px;cursor:pointer;letter-spacing:.2px}
.authbtn:hover{filter:brightness(1.05)}
.authbtn:disabled{opacity:.6;cursor:default}
.autherr{color:var(--t-crit,#AE3B36);font-size:12.5px;min-height:16px;margin:2px 0 4px;text-align:left}
.authnote{color:var(--muted);font-size:11.5px;margin-top:16px;line-height:1.5}
.ava:not([src]),.ava[src=""]{display:none}
#logoutbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;
  padding:6px 11px;font-weight:600;font-size:12.5px;cursor:pointer}
#logoutbtn:hover{color:var(--ink)}
</style>

/* Firestore-shaped adapter over a backend */
function makeDB(b){
  return {
    collection(name){ return { onSnapshot:(n,e)=>b.watch(name,n,e) }; },
    doc(path){ const p=path.split('/'); const coll=p[0], id=p.slice(1).join('/');
      return { set:(o)=>b.set(coll,id,o), update:(x)=>b.update(coll,id,x), delete:()=>b.del(coll,id) }; }
  };
}
function makeUser(){ return { me:async()=> authUser?{name:authUser.name,avatarUrl:authUser.avatarUrl||''}:null, can:async()=>true }; }

/* ---- LOCAL backend (modo demonstração: só neste navegador) ---- */
const LocalBackend = {
  KEY:'cv_deals_v1', L:[],
  _map(){ let m; try{ m=JSON.parse(localStorage.getItem(this.KEY)||'null'); }catch(e){ m=null; }
    if(!m){ m={}; (window.__SEED||[]).forEach(d=>{ const o=Object.assign({},d); delete o.id; m[d.id]=o; }); localStorage.setItem(this.KEY,JSON.stringify(m)); }
    return m; },
  _save(m){ localStorage.setItem(this.KEY,JSON.stringify(m)); this._emit(); },
  _emit(){ const m=this._map(); const snap={docs:Object.keys(m).map(id=>({id,exists:true,data:()=>m[id]}))};
    this.L.forEach(fn=>{ try{ fn(snap); }catch(e){} }); },
  watch(coll,n){ this.L.push(n); this._emit(); return ()=>{ this.L=this.L.filter(f=>f!==n); }; },
  async set(coll,id,o){ const m=this._map(); const x=Object.assign({},o); delete x.id; m[id]=x; this._save(m); },
  async update(coll,id,p){ const m=this._map(); m[id]=Object.assign({},m[id]||{},p); this._save(m); },
  async del(coll,id){ const m=this._map(); delete m[id]; this._save(m); }
};
window.addEventListener('storage',e=>{ if(e.key===LocalBackend.KEY) LocalBackend._emit(); });

/* ---- SUPABASE backend (produção: multi-sócio, dados na nuvem) ---- */
function SupaBackend(sb){
  return {
    sb, cache:[], onNext:null,
    async _fetch(){ const r=await sb.from('deals').select('id,data'); if(r.error) throw r.error; this.cache=r.data||[]; return this.cache; },
    _snap(){ return { docs:this.cache.map(x=>({id:x.id,exists:true,data:()=>x.data||{}})) }; },
    _push(){ if(this.onNext) this.onNext(this._snap()); },
    watch(coll,n,e){ this.onNext=n; let on=true;
      this._fetch().then(()=>on&&this._push()).catch(err=>e&&e(err));
      const ch=sb.channel('deals-rt').on('postgres_changes',{event:'*',schema:'public',table:'deals'},
        ()=>{ this._fetch().then(()=>on&&this._push()).catch(()=>{}); }).subscribe();
      return ()=>{ on=false; try{ sb.removeChannel(ch); }catch(_){} }; },
    async set(coll,id,o){ const x=Object.assign({},o); delete x.id;
      const r=await sb.from('deals').upsert({id,data:x,updated_at:x.updatedAt||Date.now()}); if(r.error) throw r.error; await this._fetch(); this._push(); },
    async update(coll,id,p){ const cur=(this.cache.find(y=>y.id===id)||{}).data||{}; const m=Object.assign({},cur,p);
      const r=await sb.from('deals').update({data:m,updated_at:m.updatedAt||Date.now()}).eq('id',id); if(r.error) throw r.error; await this._fetch(); this._push(); },
    async del(coll,id){ const r=await sb.from('deals').delete().eq('id',id); if(r.error) throw r.error; await this._fetch(); this._push(); }
  };
}

async function sha(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cv-salt-9:'+s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }

function initBackend(){
  if(HAS_SUPA){ sbClient=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY); backend=SupaBackend(sbClient); }
  else{ backend=LocalBackend; }
}

async function doSignUp(name,email,pass){
  if(HAS_SUPA){ const {data,error}=await sbClient.auth.signUp({email,password:pass,options:{data:{name}}});
    if(error) throw error; if(!data.session) return {pending:true}; authUser={name,email}; return {ok:true}; }
  const u=JSON.parse(localStorage.getItem('cv_users')||'{}');
  if(u[email]) throw new Error('E-mail já cadastrado — faça login.');
  u[email]={name,email,hash:await sha(email+'|'+pass)}; localStorage.setItem('cv_users',JSON.stringify(u));
  localStorage.setItem('cv_session',email); authUser={name,email}; return {ok:true};
}
async function doSignIn(email,pass){
  if(HAS_SUPA){ const {data,error}=await sbClient.auth.signInWithPassword({email,password:pass});
    if(error) throw error; const m=data.user.user_metadata||{}; authUser={name:m.name||email,email}; return {ok:true}; }
  const u=JSON.parse(localStorage.getItem('cv_users')||'{}'); const r=u[email];
  if(!r || r.hash!==await sha(email+'|'+pass)) throw new Error('E-mail ou senha incorretos.');
  localStorage.setItem('cv_session',email); authUser={name:r.name,email}; return {ok:true};
}
async function doSignOut(){ try{ if(HAS_SUPA) await sbClient.auth.signOut(); else localStorage.removeItem('cv_session'); }catch(e){} authUser=null; location.reload(); }
async function restoreSession(){
  if(HAS_SUPA){ const {data}=await sbClient.auth.getSession(); if(data&&data.session){ const u=data.session.user,m=u.user_metadata||{}; authUser={name:m.name||u.email,email:u.email}; return true; } return false; }
  const em=localStorage.getItem('cv_session'); if(!em) return false;
  const u=JSON.parse(localStorage.getItem('cv_users')||'{}'); if(!u[em]) return false; authUser={name:u[em].name,email:em}; return true;
}

/* ---- auth overlay wiring ---- */
let authMode='login';
function showAuth(){
  const g=$('#authgate'); g.hidden=false;
  const note=$('#au-note');
  note.innerHTML = HAS_SUPA ? 'Acesso restrito aos s&oacute;cios da Colorado.' :
    '<b>Modo demonstra&ccedil;&atilde;o</b> &mdash; os dados ficam s&oacute; neste navegador. Para multi-s&oacute;cio, conecte o Supabase (ver README).';
  $('#tab-login').onclick=()=>setMode('login');
  $('#tab-signup').onclick=()=>setMode('signup');
  $('#au-go').onclick=submitAuth;
  ['au-name','au-email','au-pass'].forEach(id=>{ $('#'+id).onkeydown=e=>{ if(e.key==='Enter') submitAuth(); }; });
  setMode('login'); setTimeout(()=>$('#au-email').focus(),60);
}
function setMode(m){ authMode=m;
  $('#tab-login').classList.toggle('on',m==='login');
  $('#tab-signup').classList.toggle('on',m==='signup');
  $('#nameRow').hidden = (m!=='signup');
  $('#au-go').textContent = (m==='signup')?'Criar conta':'Entrar';
  $('#au-pass').autocomplete = (m==='signup')?'new-password':'current-password';
  $('#au-err').textContent='';
}
async function submitAuth(){
  const err=$('#au-err'); err.textContent='';
  const name=($('#au-name').value||'').trim(), email=($('#au-email').value||'').trim().toLowerCase(), pass=$('#au-pass').value||'';
  if(!email||!pass){ err.textContent='Preencha e-mail e senha.'; return; }
  if(authMode==='signup'&&!name){ err.textContent='Digite seu nome.'; return; }
  if(pass.length<6){ err.textContent='A senha precisa de ao menos 6 caracteres.'; return; }
  const btn=$('#au-go'); btn.disabled=true; btn.textContent='Aguarde…';
  try{
    const r = authMode==='signup' ? await doSignUp(name,email,pass) : await doSignIn(email,pass);
    if(r.pending){ err.style.color='var(--muted)'; err.textContent='Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre.'; setMode('login'); btn.disabled=false; btn.textContent='Entrar'; return; }
    launch();
  }catch(e){ err.textContent=(e&&e.message)?e.message:'Não foi possível. Tente de novo.'; btn.disabled=false; btn.textContent=(authMode==='signup')?'Criar conta':'Entrar'; }
}
function hideAuth(){ const g=$('#authgate'); if(g) g.hidden=true; }
function addLogout(){
  if($('#logoutbtn')) return;
  const b=document.createElement('button'); b.id='logoutbtn'; b.type='button'; b.textContent='Sair';
  b.title='Sair ('+(authUser?authUser.email:'')+')'; b.onclick=doSignOut;
  const bar=$('.topin'); if(bar) bar.appendChild(b);
}

async function startApp(){
  initBackend();
  let ok=false; try{ ok=await restoreSession(); }catch(e){}
  if(ok){ launch(); } else { showAuth(); }
}
function launch(){
  hideAuth();
  window.claude = { use: async(n)=> n==='db'?makeDB(backend) : n==='user'?makeUser() : null };
  addLogout();
  boot();
}

startApp();
async function boot(){
  const C=window.claude;
  if(!C||!C.use){ state.deals=[]; renderMain(); return; }
  let db=null,user=null;
  try{ db=await C.use('db'); }catch(e){}
  try{ user=await C.use('user'); }catch(e){}
  state.db=db;
  if(user){ try{ state.me=await user.me(); const w=await user.can('data.write'); state.canWrite=(w!==false); renderViewer(); }catch(e){} }
  if(!db){ state.deals=[]; renderMain(); return; }
  db.collection('deals').onSnapshot(snap=>{
    state.deals=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
    state.deals.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    renderMain(); if(state.sel) syncSelected();
  },err=>{ if(state.deals==null){state.deals=[];renderMain();} });
}
function renderViewer(){ const v=$('#viewer'); if(!state.me)return; v.hidden=false; $('#ava').src=state.me.avatarUrl||''; $('#vname').textContent=state.me.name||'Você'; }

function fmtMoney(v,cur){ if(v==null||v===''||isNaN(Number(v)))return'—'; const n=Number(v),s=cur==='USD'?'US$':'R$';
  if(Math.abs(n)>=1e6)return s+' '+(n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi';
  if(Math.abs(n)>=1e3)return s+' '+(n/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';
  return s+' '+n.toLocaleString('pt-BR'); }
function dealVal(d){ const v=d.ticket||d.raise||d.targetSize||d.commitment; return fmtMoney(v,d.currency); }

/* ---------- render ---------- */
function renderMain(){
  const m=$('#main');
  if(state.deals===null){ m.innerHTML=heroHTML()+'<div class="empty"><h3>Carregando…</h3><p>Conectando ao banco compartilhado da Colorado.</p></div>'; return; }
  if(state.view==='dash')renderDash(m);
  else if(state.view==='funil')renderFunil(m);
  else if(state.view==='invest')renderInvest(m);
  else if(state.view==='fundos')renderFundos(m);
  else renderTable(m);
}

function connBanner(){ if(state.db) return ''; return '<div class="note">Entre com sua conta Colorado (abra pelo link compartilhado) para ver e editar os dados do CRM. Agora você está vendo uma prévia vazia.</div>'; }

function renderDash(m){
  const ds=state.deals, by=t=>ds.filter(d=>d.type===t);
  const active=ds.filter(d=>!LOST.includes(d.stage)), won=ds.filter(d=>WON.includes(d.stage));
  const inDD=ds.filter(d=>d.stage==='Due Diligence'||d.stage==='Comitê');
  let h=heroHTML()+connBanner();
  if(ds.length===0 && state.db){ h+=`<div class="empty"><h3>Seu CRM está pronto</h3><p>Nenhum deal ainda. Clique em <b>Novo deal</b> para adicionar o primeiro.</p></div>`; m.innerHTML=h; return; }
  h+=`<div class="stats">
    ${stat('Deals no total',ds.length,active.length+' ativos')}
    ${stat('Inovação · CVC',by('cvc').length,'funil de startups')}
    ${stat('Family Office',by('fo').length,'ativos alternativos')}
    ${stat('Fundos',by('fundo').length,'VC · PE · RE')}
    ${stat('Em DD / Comitê',inDD.length,'em avaliação')}
    ${stat('Investidas / Alocadas',won.length,'portfólio')}
  </div>`;
  h+='<div class="panel"><h2>Funil por estágio</h2><div class="sub">Distribuição de cada pipeline. Clique em “Funil” para abrir o kanban.</div><div class="funnelgrid">';
  for(const t of ['cvc','poc','fo','fundo']){
    const list=by(t); if(!list.length)continue;
    const mx=Math.max(1,...TYPES[t].stages.map(s=>list.filter(d=>d.stage===s).length));
    h+=`<div class="fnl"><div class="hd"><span class="chip ${TYPES[t].cls}">${TYPES[t].short}</span><b>${esc(TYPES[t].label)}</b><span class="muted">· ${list.length}</span></div><div class="bars">`;
    for(const s of TYPES[t].stages){ const c=list.filter(d=>d.stage===s).length; h+=`<div class="barcell"><div class="bn">${esc(s)}</div><div class="bc tnum">${c}</div><div class="bar" style="width:${Math.round(c/mx*100)}%;opacity:${c?.85:.12}"></div></div>`; }
    h+='</div></div>';
  }
  h+='</div>';
  const recent=[...ds].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,6);
  if(recent.length){ h+='<div class="panel"><h2>Atualizados recentemente</h2><div class="tablewrap" style="border:0;box-shadow:none"><table><tbody>';
    for(const d of recent){ h+=`<tr data-id="${esc(d.id)}"><td class="tname">${esc(d.name)}</td><td><span class="chip ${TYPES[d.type]?.cls||''}">${TYPES[d.type]?.short||''}</span></td><td class="muted">${esc(d.sector||'')}</td><td><span class="pill ${stageClass(d.stage)}">${esc(d.stage||'')}</span></td><td class="muted tnum">${dealVal(d)}</td></tr>`; }
    h+='</tbody></table></div></div>'; }
  m.innerHTML=h;
  m.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openDrawer(r.dataset.id));
}
function stat(k,v,s){ return `<div class="stat"><div class="k">${esc(k)}</div><div class="v tnum">${v}</div><div class="s">${esc(s)}</div></div>`; }

function renderFunil(m){
  const T=TYPES[state.ktype];
  let h=connBanner()+'<div class="kbar"><div class="seg" id="kseg">';
  for(const t of ['cvc','poc','fo','fundo']) h+=`<button data-t="${t}" aria-selected="${t===state.ktype}">${esc(TYPES[t].label)}</button>`;
  h+='</div><span class="muted" style="font-size:12.5px">Arraste os cards entre as colunas — ou abra para ver o resumo.</span></div>';
  const list=state.deals.filter(d=>d.type===state.ktype);
  h+='<div class="board" id="board">';
  for(const s of T.stages){
    const items=list.filter(d=>(d.stage||T.stages[0])===s);
    h+=`<div class="col" data-stage="${esc(s)}"><div class="ch"><span class="nm">${esc(s)}</span><span class="ct tnum">${items.length}</span></div><div class="body">`;
    for(const d of items) h+=cardHTML(d,T);
    h+='</div></div>';
  }
  h+='</div>';
  m.innerHTML=h;
  $('#kseg').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; state.ktype=b.dataset.t; renderMain();});
  wireBoard(m);
}
function dealHost(d){
  let s=d.website||'';
  if(!s){ const m=(d.notes||'').match(/Dom[ií]nio\(s\):\s*([a-z0-9.\-]+)/i); if(m) s=m[1]; }
  if(!s) return '';
  try{ return new URL(s.startsWith('http')?s:'https://'+s).hostname.replace(/^www\./,''); }catch(e){ return s.replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0]; }
}
function logoHTML(d,big){
  const h=dealHost(d);
  const init=esc((d.name||'?').replace(/[^A-Za-zÀ-ÿ0-9 ]/g,'').trim().slice(0,2).toUpperCase()||'?');
  const cls='logoWrap'+(big?' logoLg':'');
  if(!h) return `<span class="${cls}">${init}</span>`;
  const g='https://www.google.com/s2/favicons?domain='+encodeURIComponent(h)+'&sz=64';
  const c='https://logo.clearbit.com/'+encodeURIComponent(h)+'?size=64';
  return `<span class="${cls}">${init}<img src="${c}" alt="" loading="lazy" referrerpolicy="no-referrer" data-g="${g}" onerror="if(this.dataset.g){this.src=this.dataset.g;this.removeAttribute('data-g');}else{this.remove();}"></span>`;
}
function cardHTML(d,T){
  const drv=d.driveUrl?`<a class="drv" href="${esc(d.driveUrl)}" target="_blank" rel="noopener" title="Abrir no Drive" onclick="event.stopPropagation()"><svg class="ic" viewBox="0 0 24 24"><path d="M7.7 3.5h8.6l5 8.5-4.3 7.5H7L2.7 12z"/></svg></a>`:'';
  const zz=d.summary?`<div class="cz">${esc(d.summary)}</div>`:'';
  return `<div class="card" draggable="true" data-id="${esc(d.id)}" style="--acc:${T.accent}">
    <div class="cn">${logoHTML(d)}<span>${esc(d.name)}</span></div>
    <div class="cs">${esc(d.sector||'—')}${d.owner?' · '+esc(d.owner):''}</div>
    ${zz}
    <div class="cf"><span class="val tnum">${dealVal(d)}</span>${d.status?`<span class="pill ${stageClass(d.stage)}">${esc(d.status)}</span>`:drv?'':''}</div>
    ${drv?`<div class="cf" style="margin-top:7px">${drv}<span></span></div>`:''}
  </div>`;
}
function wireBoard(m){
  m.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>openDrawer(c.dataset.id);
    c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/id',c.dataset.id);e.dataTransfer.effectAllowed='move';setTimeout(()=>c.style.opacity='.4',0);});
    c.addEventListener('dragend',()=>c.style.opacity='');
  });
  m.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop');});
    col.addEventListener('dragleave',()=>col.classList.remove('drop'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drop');const id=e.dataTransfer.getData('text/id');moveStage(id,col.dataset.stage);});
  });
}
async function moveStage(id,stage){
  const d=state.deals.find(x=>x.id===id); if(!d||d.stage===stage)return;
  d.stage=stage; renderMain();
  try{ await state.db.doc('deals/'+id).update({stage,updatedAt:Date.now()}); toast(esc(d.name)+' → '+stage); }
  catch(e){ toast('Não foi possível mover (sem permissão de escrita).'); }
}

function renderTable(m){
  let h=connBanner()+'<div class="toolbar"><div class="seg" id="tseg">';
  for(const t of [['all','Todos'],['cvc','CVC'],['poc','PoC'],['fo','Family Office'],['fundo','Fundos']]) h+=`<button data-t="${t[0]}" aria-selected="${t[0]===state.ttype}">${t[1]}</button>`;
  h+=`</div><div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar por nome, setor, responsável…" value="${esc(state.q)}"></div></div>`;
  let list=state.deals.filter(d=>state.ttype==='all'||d.type===state.ttype);
  if(state.q){ const q=state.q.toLowerCase(); list=list.filter(d=>[d.name,d.sector,d.owner,d.status,d.gp,d.strategy,d.summary].some(x=>(x||'').toLowerCase().includes(q))); }
  h+='<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Setor</th><th>Estágio</th><th>Responsável</th><th>Valor</th><th>Drive</th></tr></thead><tbody>';
  if(!list.length) h+='<tr><td colspan="7" class="muted" style="padding:28px;text-align:center">Nenhum deal aqui ainda.</td></tr>';
  for(const d of list){ h+=`<tr data-id="${esc(d.id)}"><td class="tname">${esc(d.name)}</td><td><span class="chip ${TYPES[d.type]?.cls||''}">${TYPES[d.type]?.short||'—'}</span></td><td class="muted">${esc(d.sector||'')}</td><td><span class="pill ${stageClass(d.stage)}">${esc(d.stage||'')}</span></td><td>${esc(d.owner||'')}</td><td class="tnum">${dealVal(d)}</td><td>${d.driveUrl?`<a class="drv" href="${esc(d.driveUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg class="ic" viewBox="0 0 24 24"><path d="M7.7 3.5h8.6l5 8.5-4.3 7.5H7L2.7 12z"/></svg></a>`:'<span class="muted">—</span>'}</td></tr>`; }
  h+='</tbody></table></div>';
  m.innerHTML=h;
  $('#tseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.ttype=b.dataset.t;renderMain();});
  const qi=$('#q'); qi.oninput=()=>{state.q=qi.value; clearTimeout(qi._t); qi._t=setTimeout(()=>{renderTable(m);$('#q').focus();},160);};
  m.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openDrawer(r.dataset.id));
}

function renderInvest(m){
  const list=state.deals.filter(d=>WON.includes(d.stage)||d.portfolio);
  let h=connBanner()+'<div class="panel"><h2>Investidas · portfólio</h2><div class="sub">Empresas e ativos onde a Colorado já investiu. Mova um deal para “Investida” (CVC) ou “Alocado” (Fundos/FO) no funil e ele entra aqui.</div>';
  if(!list.length){ h+='<div class="empty"><h3>Ainda sem investidas marcadas</h3><p>No <b>Funil</b>, arraste um deal para a coluna “Investida” / “Alocado” — ele aparece aqui automaticamente.</p></div></div>'; m.innerHTML=h; return; }
  h+='<div class="tablewrap"><table><thead><tr><th>Investida</th><th>Tipo</th><th>Setor</th><th>Aporte</th><th>%</th><th>Entrada → Atual</th><th>Múlt.</th></tr></thead><tbody>';
  for(const d of list){ const mult=(d.entryVal&&d.currentVal)?(d.currentVal/d.entryVal).toFixed(1)+'x':'—'; const ea=(d.entryVal||d.currentVal)?`${d.entryVal?fmtMoney(d.entryVal,d.currency):'—'} → ${d.currentVal?fmtMoney(d.currentVal,d.currency):'—'}`:'<span class="muted">—</span>'; h+=`<tr data-id="${esc(d.id)}"><td class="tname">${esc(d.name)}</td><td><span class="chip ${TYPES[d.type]?.cls||''}">${TYPES[d.type]?.short||''}</span></td><td class="muted">${esc(d.sector||'')}</td><td class="tnum">${dealVal(d)}</td><td class="tnum">${d.stake?esc(d.stake):'<span class="muted">—</span>'}</td><td class="tnum">${ea}</td><td class="tnum">${mult}</td></tr>`; }
  h+='</tbody></table></div></div>';
  m.innerHTML=h;
  m.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openDrawer(r.dataset.id));
}
function renderFundos(m){
  const list=state.deals.filter(d=>d.type==='fundo'||d.type==='fo');
  let h=connBanner()+'<div class="panel"><h2>Fundos · onde somos investidores</h2><div class="sub">Acompanhamento de capital call e crescimento. Clique em um fundo para preencher comprometido, chamado, NAV, DPI/TVPI e a próxima chamada.</div>';
  if(!list.length){ h+='<div class="empty"><p>Nenhum fundo ainda.</p></div></div>'; m.innerHTML=h; return; }
  h+='<div class="tablewrap"><table><thead><tr><th>Fundo</th><th>GP</th><th>Estratégia</th><th>Comprometido</th><th>Chamado</th><th>A chamar</th><th>Atual / NAV</th><th>DPI</th><th>TVPI</th><th>Próx. chamada</th></tr></thead><tbody>';
  for(const d of list){ const mo=v=>v?`<span class="tnum">${fmtMoney(v,d.currency)}</span>`:'<span class="muted">—</span>'; const tx=v=>v?esc(v):'<span class="muted">—</span>';
    h+=`<tr data-id="${esc(d.id)}"><td class="tname">${esc(d.name)}</td><td class="muted">${esc(d.gp||'')}</td><td class="muted">${esc(d.strategy||d.assetClass||'')}</td><td>${mo(d.commitment||d.targetSize)}</td><td>${mo(d.capitalCalled)}</td><td>${mo(d.capitalToCall)}</td><td>${mo(d.nav)}</td><td>${tx(d.dpi)}</td><td>${tx(d.tvpi)}</td><td class="muted">${tx(d.nextCall)}</td></tr>`; }
  h+='</tbody></table></div></div>';
  m.innerHTML=h;
  m.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openDrawer(r.dataset.id));
}
/* ---------- drawer ---------- */
function openDrawer(id,isNew){
  if(isNew){ state.sel=null; state.editing=true; state.draft={type:'cvc',currency:'BRL',stage:'Originação'}; }
  else{ state.sel=state.deals.find(d=>d.id===id); if(!state.sel)return; state.editing=false; state.draft=null; }
  drawDrawer(); $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false'); $('#scrim').classList.add('on');
}
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('on'); state.editing=false; state.draft=null; }
function syncSelected(){ if(state.sel){ const u=state.deals.find(d=>d.id===state.sel.id); if(u&&!state.editing){state.sel=u; if($('#drawer').classList.contains('on'))drawDrawer();} } }

function fieldRO(key,label,val,type,hl){
  let disp=val==null||val===''?'—':val;
  if(type==='money')disp=fmtMoney(val,state.sel?.currency);
  if(key==='type')disp=TYPES[val]?.label||val;
  if(key==='driveUrl'&&val)return `<div class="field"><label>${esc(label)}</label><a class="drvbig" href="${esc(val)}" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24"><path d="M7.7 3.5h8.6l5 8.5-4.3 7.5H7L2.7 12z"/></svg>Abrir no Drive</a></div>`;
  if(key==='website'&&val)disp=`<a href="${esc(val.startsWith('http')?val:'https://'+val)}" target="_blank" rel="noopener" style="color:var(--t-fundo)">${esc(val)}</a>`;
  else disp=esc(disp);
  return `<div class="field${hl?' hl':''}"><label>${esc(label)}</label><div class="ro">${disp}</div></div>`;
}
function fmtDate(x){ if(x==null||x==='')return''; const t=typeof x==='number'?x:Date.parse(x); if(!t||isNaN(t))return esc(String(x)); try{return new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return''} }
function activitiesHTML(d){
  const a=Array.isArray(d.activities)?d.activities.slice():[];
  a.sort((x,y)=>{const tx=typeof x.date==='number'?x.date:(Date.parse(x.date||0)||0), ty=typeof y.date==='number'?y.date:(Date.parse(y.date||0)||0); return ty-tx;});
  const icon={email:'✉️',meeting:'📅',file:'📄',note:'📝'};
  let h='<div class="sectlabel">Atividades · e-mails, agenda e Drive</div>';
  if(!a.length){ h+='<div class="muted" style="font-size:12.5px;padding:2px 0 6px">Ainda sem atividades sincronizadas aqui. Vou vincular os e-mails e reuniões relacionados a este deal.</div>'; return h; }
  h+='<div class="acts">';
  for(const it of a){ const k=it.kind||'note'; const dt=fmtDate(it.date); const ti=it.link?`<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title||'(sem título)')}</a>`:esc(it.title||'(sem título)'); h+=`<div class="act"><div class="ai">${icon[k]||'•'}</div><div class="ac"><div class="at">${ti}</div>${it.snippet?`<div class="asn">${esc(it.snippet)}</div>`:''}${dt?`<div class="ad">${dt}</div>`:''}</div></div>`; }
  h+='</div>'; return h;
}
function fieldEdit(key,label,type,opts){
  const src=state.draft||state.sel||{}; const v=src[key]==null?'':src[key];
  if(type==='type')return `<div class="field"><label>${esc(label)}</label><select data-k="type">${Object.keys(TYPES).map(t=>`<option value="${t}"${t===v?' selected':''}>${esc(TYPES[t].label)}</option>`).join('')}</select></div>`;
  if(type==='stage'){ const tp=(state.draft||state.sel||{}).type||'cvc'; return `<div class="field"><label>${esc(label)}</label><select data-k="stage">${TYPES[tp].stages.map(s=>`<option${s===v?' selected':''}>${esc(s)}</option>`).join('')}</select></div>`; }
  if(type==='currency')return `<div class="field"><label>${esc(label)}</label><select data-k="currency">${['BRL','USD'].map(c=>`<option value="${c}"${c===v?' selected':''}>${c==='BRL'?'R$ (BRL)':'US$ (USD)'}</option>`).join('')}</select></div>`;
  if(type==='select')return `<div class="field"><label>${esc(label)}</label><select data-k="${key}"><option value=""${v===''?' selected':''}>—</option>${(opts||[]).map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if(type==='textarea')return `<div class="field"><label>${esc(label)}</label><textarea data-k="${key}">${esc(v)}</textarea></div>`;
  const it=type==='money'?'number':'text';
  return `<div class="field"><label>${esc(label)}</label><input type="${it}" data-k="${key}" value="${esc(v)}"></div>`;
}
function drawDrawer(){
  const d=state.sel, ed=state.editing, dr=$('#drawer');
  const tp=(state.draft||d||{}).type||'cvc';
  const head=ed
    ? `<div class="dhead"><div class="ti"><h3>${d?'Editar deal':'Novo deal'}</h3><div class="meta"><span class="muted" style="font-size:12px">Preencha os campos e salve no banco compartilhado.</span></div></div><button class="iconbtn" id="xbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`
    : `<div class="dhead"><div class="ti"><h3 style="display:flex;align-items:center;gap:9px">${logoHTML(d,true)}<span>${esc(d.name)}</span></h3><div class="meta"><span class="chip ${TYPES[d.type]?.cls||''}">${TYPES[d.type]?.short||''}</span><span class="pill ${stageClass(d.stage)}">${esc(d.stage||'')}</span>${d.status?`<span class="pill neu">${esc(d.status)}</span>`:''}</div></div><button class="iconbtn" id="xbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`;
  let body='<div class="dbody">';
  if(ed){
    body+=fieldEdit('name','Nome','text');
    body+=fieldEdit('summary','Resumo (1–2 linhas)','textarea');
    body+='<div class="grid2">'+fieldEdit('type','Tipo','type')+fieldEdit('stage','Estágio','stage')+'</div>';
    body+='<div class="grid2">'+fieldEdit('sector','Setor','text')+fieldEdit('owner','Responsável','text')+'</div>';
    body+='<div class="grid2">'+fieldEdit('currency','Moeda','currency')+fieldEdit('ticket','Valor / ticket','money')+'</div>';
    body+=fieldEdit('status','Status (rótulo curto)','text');
    body+='<div class="sectlabel">Qualificação</div>';
    body+='<div class="grid2">'+fieldEdit('tipoEco','Tipo de ecossistema','select',['Startup','Venture Capital','Corporate Venture Capital','Big Corp','Governo / Institucional','Hub / Rede de Inovação'])+fieldEdit('prioridade','Prioridade','select',['Alta','Média','Baixa'])+'</div>';
    body+=fieldEdit('proximoPasso','Próximo passo','text');
    body+=fieldEdit('motivoDecisao','Motivo de ganho/perda','text');
    body+='<div class="sectlabel">Portfólio (se já investida)</div>';
    body+='<div class="grid2">'+fieldEdit('portfolio','É investida?','select',['Sim','Não'])+fieldEdit('aporteDate','Data do aporte','text')+'</div>';
    body+='<div class="grid2">'+fieldEdit('stake','% adquirido','text')+fieldEdit('entryVal','Valuation de entrada','money')+'</div>';
    body+=fieldEdit('currentVal','Valuation atual','money');
    body+='<div class="sectlabel">Campos de '+esc(TYPES[tp].label)+'</div>';
    const ex=EXTRA[tp]||[]; for(let i=0;i<ex.length;){ const a=ex[i], b=ex[i+1]; if(a[2]!=='textarea'&&b&&b[2]!=='textarea'){ body+='<div class="grid2">'+fieldEdit(a[0],a[1],a[2])+fieldEdit(b[0],b[1],b[2])+'</div>'; i+=2; } else { body+=fieldEdit(a[0],a[1],a[2]); i+=1; } }
    body+='<div class="sectlabel">Vínculos</div>';
    body+=fieldEdit('website','Site','text')+fieldEdit('driveUrl','Pasta no Drive (link)','text')+fieldEdit('notes','Observações','textarea');
  }else{
    if(d.summary) body+=`<div class="resumo">${esc(d.summary)}</div>`;
    body+='<div class="grid2">'+fieldRO('sector','Setor',d.sector,null,true)+fieldRO('owner','Responsável',d.owner)+'</div>';
    body+=fieldRO('ticket','Valor / ticket',d.ticket||d.raise||d.targetSize||d.commitment,'money');
    if(d.tipoEco||d.prioridade)body+='<div class="grid2">'+fieldRO('tipoEco','Tipo de ecossistema',d.tipoEco)+fieldRO('prioridade','Prioridade',d.prioridade)+'</div>';
    if(d.proximoPasso)body+=fieldRO('proximoPasso','Próximo passo',d.proximoPasso,null,true);
    if(d.motivoDecisao)body+=fieldRO('motivoDecisao','Motivo (ganho/perda)',d.motivoDecisao);
    if(d.portfolio||d.stake||d.entryVal||d.currentVal||d.aporteDate){ body+='<div class="sectlabel">Portfólio</div>'; body+='<div class="grid2">'+fieldRO('stake','% adquirido',d.stake)+fieldRO('aporteDate','Data do aporte',d.aporteDate)+'</div>'; if(d.entryVal||d.currentVal){ const mult=(d.entryVal&&d.currentVal)?(d.currentVal/d.entryVal).toFixed(1)+'x':''; body+='<div class="grid2">'+fieldRO('entryVal','Valuation entrada',d.entryVal,'money')+fieldRO('currentVal','Valuation atual',d.currentVal,'money')+'</div>'; if(mult)body+=fieldRO('mult','Múltiplo (atual/entrada)',mult,null,true); } }
    const ex=EXTRA[d.type]||[]; const filled=ex.filter(f=>d[f[0]]!=null&&d[f[0]]!=='');
    if(filled.length){ body+='<div class="sectlabel">'+esc(TYPES[d.type].label)+'</div>'; for(const f of filled)body+=fieldRO(f[0],f[1],d[f[0]],f[2]); }
    if(d.notes)body+=fieldRO('notes','Observações',d.notes);
    {const _site=d.website||(dealHost(d)?('https://'+dealHost(d)):''); if(_site)body+=fieldRO('website','Site',_site);}
    body+=fieldRO('driveUrl','Materiais no Drive',d.driveUrl);
    body+=activitiesHTML(d);
  }
  body+='</div>';
  let foot='<div class="dfoot">';
  if(ed){ foot+=`<button class="btn primary" id="savebtn">Salvar</button><button class="btn" id="cancelbtn">Cancelar</button>`; if(d)foot+=`<div class="spacer"></div><button class="linkbtn" id="delbtn">Excluir</button>`; }
  else{ foot+=`<button class="btn primary" id="editbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Editar</button>`; if(d.driveUrl)foot+=`<a class="btn" href="${esc(d.driveUrl)}" target="_blank" rel="noopener">Abrir Drive</a>`; }
  foot+='</div>';
  dr.innerHTML=head+body+foot;
  $('#xbtn').onclick=closeDrawer;
  if(ed){
    dr.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{ state.draft=state.draft||Object.assign({},state.sel); const k=el.dataset.k; state.draft[k]=el.value; if(k==='type'){ state.draft.stage=TYPES[el.value].stages[0]; drawDrawer(); } }));
    $('#savebtn').onclick=saveDraft; $('#cancelbtn').onclick=()=>{ if(state.sel){state.editing=false;state.draft=null;drawDrawer();}else closeDrawer(); };
    if($('#delbtn'))$('#delbtn').onclick=delDeal;
  }else{ $('#editbtn').onclick=()=>{ state.editing=true; state.draft=Object.assign({},state.sel); drawDrawer(); }; }
}
function slug(s){ return (s||'deal').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,32)||'deal'; }
async function saveDraft(){
  const o=Object.assign({},state.draft);
  if(!o.name||!o.name.trim()){ toast('Dê um nome ao deal.'); return; }
  ['ticket','raise','revenue','targetSize','commitment'].forEach(k=>{ if(o[k]==='')delete o[k]; else if(o[k]!=null)o[k]=Number(o[k]); });
  o.updatedAt=Date.now();
  if(!state.db){ toast('Sem conexão com o banco (abra pelo link compartilhado).'); return; }
  const id=state.sel?state.sel.id:('deal-'+slug(o.name)+'-'+Math.random().toString(36).slice(2,6));
  try{ await state.db.doc('deals/'+id).set(o); toast(state.sel?'Deal atualizado':'Deal criado'); state.editing=false; state.draft=null; state.sel=Object.assign({id},o); drawDrawer(); }
  catch(e){ toast('Não foi possível salvar (sem permissão de escrita).'); }
}
async function delDeal(){
  if(!state.sel)return; if(state._confirmDel!==state.sel.id){ state._confirmDel=state.sel.id; $('#delbtn').textContent='Confirmar exclusão'; return; }
  try{ await state.db.doc('deals/'+state.sel.id).delete(); toast('Deal excluído'); closeDrawer(); }
  catch(e){ toast('Não foi possível excluir.'); }
}
</script>
